<a class="review-row" href="{% url 'clubs:discussion_detail' discussion.id %}">
  {% if show_book %}
    {# JOIN возвращает именованные столбцы sqlite3.Row. #}
    <span class="review-book">{{ discussion.book_title }}</span>
  {% endif %}
  <span class="review-copy">{{ discussion.review|default:"Текст отзыва не указан." }}</span>
  {% if show_member %}
    <span class="review-name">{{ discussion.member_name }}</span>
  {% endif %}
</a>
