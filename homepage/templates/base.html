{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BookClub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2">
</head>
<body>
  <header class="site-header sticky-top">
    <nav class="navbar navbar-expand-lg container py-3" aria-label="Основная навигация">
      <a class="navbar-brand" href="{% url 'homepage:home' %}"><span>Book</span>Club</a>
      <div class="desktop-nav ms-auto">
        <ul class="navbar-nav ms-auto gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="{% url 'homepage:home' %}">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'books:book_list' %}">Книги</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'clubs:club_list' %}">Клубы</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'homepage:member_list' %}">Участники</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'clubs:discussion_list' %}">Отзывы</a></li>
        </ul>
      </div>
    </nav>
    <nav class="mobile-nav-links" aria-label="Мобильная навигация">
      <a href="{% url 'homepage:home' %}">Главная</a>
      <a href="{% url 'books:book_list' %}">Книги</a>
      <a href="{% url 'clubs:club_list' %}">Клубы</a>
      <a href="{% url 'homepage:member_list' %}">Участники</a>
      <a href="{% url 'clubs:discussion_list' %}">Отзывы</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">BookClub</div>
  </footer>
</body>
</html>
